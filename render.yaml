# Render Blueprint for the API (plan §24, Phase 12). In Render: New → Blueprint → this repository.
# Values marked `sync: false` are asked for when the Blueprint is created; never commit them.

services:
  - type: web
    name: roman-budhathoki-api
    runtime: node
    # Singapore is Render's closest region to Kathmandu.
    region: singapore
    # Free instances sleep after 15 minutes idle; the first request then takes up to a minute.
    # Change to "starter" (paid) to keep the API awake.
    plan: free
    branch: main
    autoDeploy: true
    # Dev dependencies are needed to compile TypeScript (NODE_ENV=production would skip them).
    # MONGOMS_DISABLE_POSTINSTALL skips the test database download (780 MB).
    buildCommand: >-
      MONGOMS_DISABLE_POSTINSTALL=1 npm ci --include=dev &&
      npm run build -w @roman/shared && npm run build -w @roman/server
    # autoIndex is off in production, so indexes are synced on every start (idempotent).
    startCommand: npm run db:sync-indexes:prod -w @roman/server && npm run start -w @roman/server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      # Vercel's rewrite and Render's proxy are in front of the API (plan §0.4).
      - key: TRUST_PROXY
        value: '2'
      - key: LOG_LEVEL
        value: info
      - key: MEDIA_DRIVER
        value: cloudinary
      - key: CLOUDINARY_ROOT_FOLDER
        value: roman-budhathoki/production
      # Random values generated by Render; nobody needs to know them.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: IP_HASH_SALT
        generateValue: true
      # Asked for when the Blueprint is created.
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_ORIGINS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
